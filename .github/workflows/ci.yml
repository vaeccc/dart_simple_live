name: CI 校验（不发布安装包）

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core analyze and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: simple_live_core
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.3
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib/src/yy_site.dart test/yy_site_test.dart
      - run: dart analyze lib/src/yy_site.dart test/yy_site_test.dart
      - run: dart test test/yy_site_test.dart

  app:
    name: APP 编译校验
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: simple_live_app
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.3
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug

  tv:
    name: TV 编译校验
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: simple_live_tv_app
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.3
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter build apk --debug
