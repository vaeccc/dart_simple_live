name: 发布 APP 正式版（含未签名 iOS 构建）

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "统一 Release 标签（需与 TV 发布使用相同的 release_* 标签）"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.3
          cache: true

      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "::error::Missing KEYSTORE_BASE64 repository secret."; exit 1; }
          test -n "$STORE_PASSWORD" || { echo "::error::Missing STORE_PASSWORD repository secret."; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "::error::Missing KEY_PASSWORD repository secret."; exit 1; }
          test -n "$KEY_ALIAS" || { echo "::error::Missing KEY_ALIAS repository secret."; exit 1; }
          key_store="$RUNNER_TEMP/simple-live-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$key_store"
          cat > simple_live_app/android/key.properties <<EOF
          storeFile=$key_store
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          EOF

      - name: Restore Dart packages
        working-directory: simple_live_app
        run: flutter pub get

      - name: Build release APKs
        working-directory: simple_live_app
        run: flutter build apk --release --split-per-abi

      - name: Name APP release APKs
        working-directory: simple_live_app
        run: |
          version="$(awk '/^version:/ {print $2}' pubspec.yaml | cut -d+ -f1)"
          mkdir -p build/release-apks
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "build/release-apks/simple-live-app-v${version}-armeabi-v7a.apk"
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "build/release-apks/simple-live-app-v${version}-arm64-v8a.apk"
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk "build/release-apks/simple-live-app-v${version}-x86_64.apk"

      - name: Upload APKs
        uses: actions/upload-artifact@v7
        with:
          name: simple-live-release-apks
          path: |
            simple_live_app/build/release-apks/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: "Simple Live ${{ inputs.release_tag }}"
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          make_latest: true
          files: |
            simple_live_app/build/release-apks/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-ios-unsigned:
    name: iOS/iPadOS 未签名构建
    runs-on: macos-latest
    defaults:
      run:
        working-directory: simple_live_app

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.3
          cache: true

      - name: Restore Dart packages
        run: flutter pub get

      - name: Build unsigned iOS/iPadOS application
        run: flutter build ios --release --no-codesign

      - name: Package unsigned application bundle
        run: |
          version="$(awk '/^version:/ {print $2}' pubspec.yaml | cut -d+ -f1)"
          mkdir -p build/unsigned-ios
          ditto -c -k --sequesterRsrc --keepParent \
            build/ios/iphoneos/Runner.app \
            "build/unsigned-ios/simple-live-ios-ipados-v${version}-unsigned.app.zip"

      - name: Upload unsigned iOS/iPadOS artifact
        uses: actions/upload-artifact@v7
        with:
          name: simple-live-ios-ipados-unsigned
          path: simple_live_app/build/unsigned-ios/*.app.zip
          if-no-files-found: error
          retention-days: 14

      - name: Attach unsigned iOS/iPadOS package to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: "Simple Live ${{ inputs.release_tag }}"
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: |
            simple_live_app/build/unsigned-ios/*.app.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
