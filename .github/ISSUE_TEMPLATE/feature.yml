name: 功能请求
title: "[Feature] 请填写简短易读的标题"
description: "请求开发新的功能或优化现有功能"
assignees: vaeccc
labels:
  - "enhancement"
body:
  - type: markdown
    attributes:
      value: |
        提交前请先确认没有相同或高度相似的 Issue。
        如果涉及新增直播平台，请尽量提供公开接口、页面示例或可复现信息；如果可以提交 PR，也欢迎附上实现思路。

  - type: checkboxes
    id: terms
    attributes:
      label: 非重复的 Issue
      description: 请先在 Issues 中搜索相似问题。
      options:
        - label: 已确认没有相似的 Issue
          required: true

  - type: textarea
    id: description
    validations:
      required: true
    attributes:
      label: 功能描述
      description: 请说明希望解决的问题、使用场景和预期效果；多个独立需求请分开提交。

  - type: checkboxes
    id: platform
    attributes:
      label: 平台
      description: 这个功能针对哪些平台
      options:
        - label: Android
        - label: iOS / iPadOS
        - label: macOS
        - label: Windows
        - label: Linux
        - label: Android TV

  - type: textarea
    id: additional
    attributes:
      label: 附加信息
      description: 可补充截图、视频、日志、接口说明或相关链接。
